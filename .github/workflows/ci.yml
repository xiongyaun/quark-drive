name: Ubuntu CLI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    name: CLI / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked -- --test-threads=1
      - run: cargo build --release -p quark-cli --locked
      - run: ./target/release/quark-probe --help
      - name: Prepare CLI artifact
        run: |
          mkdir -p dist
          install -m 755 target/release/quark-probe dist/quark-probe
          cp LICENSE dist/LICENSE
          cargo tree -p quark-cli --edges normal,build --prefix none --format '{p} | {l}' --locked > dist/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quark-probe-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
